name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:boundaries
      - name: Typecheck the e2e suite
        run: npx tsc --noEmit -p e2e
      - run: npm test
      - run: npm run build:web
      - name: Database RLS + RPC tests (PGlite)
        working-directory: supabase/tests
        run: npm ci && npm test

  verify-php:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Drive the offline demo
        timeout-minutes: 12
        env:
          VERIFY_PHP_DEADLINE_MS: '720000'
          VERIFY_PHP_COMMAND_MS: '45000'
        run: node scripts/verify-php-ci.mjs
      - name: Upload screenshots and score
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-php-${{ github.run_id }}
          path: verify-php-output/
          if-no-files-found: warn
          retention-days: 14

  skill-eval:
    runs-on: ubuntu-latest
    needs: verify-php
    if: always() && needs.verify-php.result != 'cancelled'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download the fresh score
        uses: actions/download-artifact@v4
        with:
          name: verify-php-${{ github.run_id }}
          path: verify-php-output
      - name: Compare the score with the rubric
        env:
          PR_BASE: ${{ github.base_ref }}
        run: node scripts/check-skill-eval.mjs

  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Count changed lines
        env:
          PR_BASE: ${{ github.base_ref }}
        run: node scripts/check-pr-size.mjs

  merge-gate:
    name: merge-gate
    if: always()
    needs: [check, verify-php, skill-eval, pr-size]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every gate
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          VERIFY_RESULT: ${{ needs.verify-php.result }}
          EVAL_RESULT: ${{ needs.skill-eval.result }}
          SIZE_RESULT: ${{ needs.pr-size.result }}
        run: node scripts/require-merge-gate.mjs
